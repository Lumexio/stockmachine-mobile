name: Mobile — Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install
        run: npm ci

      - name: Inject Version from Tag
        run: |
          TAG=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION="${TAG#v}"
          # Update package.json version
          npm pkg set version="$VERSION"
          # Update app.json version & versionCode
          jq '.expo.version = "'$VERSION'" | .expo.android.versionCode = '${{ github.run_number }} app.json > app.tmp && mv app.tmp app.json

      - name: Generate Native Android Folder (Prebuild)
        run: npm run prebuild

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache React Native C++ 
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/app/build
            android/app/.cxx
          key: android-build-${{ hashFiles('package-lock.json') }}
          restore-keys: android-build-

      - name: Build APK (Fast Arm64 Only)
        run: npm run build-android
        env:
          # ponytail: Build ONLY for modern Androids (arm64) to cut 30min C++ compile time down to 5mins
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: STOCKMACHINE Mobile ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/*.apk
