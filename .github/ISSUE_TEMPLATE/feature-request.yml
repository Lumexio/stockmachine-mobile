name: Feature request
description: Propose a mobile inventory workflow or platform capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain navigation, online/offline behavior, and Android/iOS considerations.
    validations:
      required: true
  - type: textarea
    id: parity
    attributes:
      label: Cross-client and localization impact
      description: Note backend, web, desktop, pricing, and en/es/fr/ja/ru changes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
