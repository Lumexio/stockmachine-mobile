name: Bug report
description: Report a reproducible Expo, Android, iOS, API, or offline defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include steps and whether the app was online, offline, or synchronizing.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Expo development client
        - Multiple platforms
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version, device/emulator, OS version, build type, and sanitized logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal data, and tenant-sensitive values.
          required: true
